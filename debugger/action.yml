name: 'Run AppLab (debugger environment)'
description: >-
  Start a complete AppLab environment on the runner — a kind cluster, a
  registry, an Istio gateway and AppLab itself — and publish it through a
  tunnel. Push an app and it is built, deployed and served.
author: 'shaowenchen'

branding:
  icon: 'box'
  color: 'orange'

inputs:
  api_key:
    description: >-
      API key for the first installation. Generated when empty, and printed in
      the summary either way.
    required: false
    default: ''
  api_key_2:
    description: >-
      API key for the second installation. Generated when empty, printed in the
      summary either way, and deliberately never filled in from api_key: the two
      installations are separate on purpose, and the environment checks that
      neither key opens the other.
    required: false
    default: ''
  session_hours:
    description: >-
      How long the environment may run, in hours; empty or 0 means no
      self-imposed limit (the job's own timeout still applies).
    required: false
    default: '4'
  tunnel:
    description: "cloudflare (no account needed) or ngrok (needs ngrok_token)."
    required: false
    default: 'cloudflare'
  cloudflare_token:
    description: >-
      Token of a named Cloudflare tunnel. Empty starts a quick tunnel instead: a
      random trycloudflare.com hostname with no account behind it.
    required: false
    default: ''
  domain_1:
    description: >-
      The domain the first installation is served under, without a scheme. Not
      tunnel configuration: a named Cloudflare tunnel keeps its hostname in its
      ingress and cannot report it, and this is what applab needs — it becomes
      ingress.host, which is both where the apps are served and the host the
      console's own route matches. Point the ingress at the tunnel first;
      nothing here can create it.
    required: false
    # Named by default, so a run serves domains you chose rather than hostnames
    # minted for that one connection. That makes the named tunnel the expected
    # path — a quick tunnel cannot be given these names, so a run with
    # cloudflare_token unset stops and says so rather than quietly publishing
    # somewhere else. Set both empty to go back to a quick tunnel's own
    # hostnames.
    default: 'applab-1.chenshaowen.com'
  domain_2:
    description: >-
      The domain the second installation is served under. Set with domain_1 or
      not at all: the two installations are separate addresses by design, so
      there is no arrangement in which one of them is named and the other is
      left to whatever the tunnel happens to report.
    required: false
    default: 'applab-2.chenshaowen.com'
  registry_username:
    description: >-
      Username for the registry the built images are pushed to and pulled from.
      The environment installs a registry credential from this and
      registry_password, and both halves of the pipeline read it: the build
      mounts it to push, and every app's Deployment references it to pull.
    required: true
  registry_password:
    description: >-
      Password or token for that registry. It needs write access, since the
      build pushes. Pass it as a secret rather than an input — an input is plain
      text any reader of the run can see.
    required: true
  registry:
    description: >-
      Where built images go, as one string applab reads the shape of: an account
      ("owner"), a repository ("owner/repo"), or a repository with a tag
      ("owner/repo:prefix"). The last gives images tagged
      "<prefix>-<app>-<commit>".
    required: false
    default: 'shaowenchen/applab:demo'
  ngrok_token:
    description: 'ngrok authtoken. Required when tunnel is ngrok.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        APPLAB_TUNNEL: ${{ inputs.tunnel }}
        NGROK_TOKEN: ${{ inputs.ngrok_token }}
        CLOUDFLARE_TOKEN: ${{ inputs.cloudflare_token }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        DOMAIN_1: ${{ inputs.domain_1 }}
        DOMAIN_2: ${{ inputs.domain_2 }}
        API_KEY_1: ${{ inputs.api_key }}
        API_KEY_2: ${{ inputs.api_key_2 }}
      run: |
        set -euo pipefail
        case "$APPLAB_TUNNEL" in
          cloudflare|ngrok) ;;
          *) echo "::error::tunnel must be 'cloudflare' or 'ngrok', got '$APPLAB_TUNNEL'"; exit 1 ;;
        esac
        # The failure this catches is a run that starts a tunnel agent with no
        # credential and only discovers it minutes later, from a missing link.
        if [ "$APPLAB_TUNNEL" = "ngrok" ] && [ -z "$NGROK_TOKEN" ]; then
          echo "::error::tunnel is 'ngrok' but ngrok_token is empty; ngrok needs an authtoken"
          exit 1
        fi
        # Checked here rather than left to the push that would fail minutes
        # later: the build pushes with this credential, and a run without one
        # installs an environment that looks healthy and cannot build anything.
        if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
          echo "::error::registry_username and registry_password are required: the built images are pushed to a real registry"
          exit 1
        fi
        # The two installations are separate on purpose, and this is the setting
        # whose absence is silent: an admin key can delete every app its
        # installation manages, so one key reaching both Secrets gives each
        # installation's owner the other's data. The script refuses it too, and
        # re-checks it from the outside once both are up — this just fails in
        # seconds instead of after ten minutes of install.
        if [ -n "$API_KEY_1" ] && [ "$API_KEY_1" = "$API_KEY_2" ]; then
          echo "::error::api_key and api_key_2 are the same value; each installation has to have its own, or either key can destroy both"
          exit 1
        fi
        # A domain can only be named for a tunnel whose ingress was arranged in
        # advance, which only a named Cloudflare tunnel has. Checked here rather
        # than in the script so a run that cannot work fails in seconds instead
        # of after a three-minute wait for a hostname that was never coming.
        #
        # Both domains are one decision, because the two installations are two
        # addresses by design: one named and one left to the tunnel would be an
        # installation served under a name Cloudflare does not answer for. The
        # check for that is repeated in the script, which is also reachable
        # without this action — see resolve_hosts.
        if [ -n "$DOMAIN_1" ] || [ -n "$DOMAIN_2" ]; then
          if [ -z "$DOMAIN_1" ] || [ -z "$DOMAIN_2" ]; then
            echo "::error::domain_1 and domain_2 must be set together; one named tunnel cannot serve the other installation's random hostname"
            exit 1
          fi
          if [ "$APPLAB_TUNNEL" != "cloudflare" ]; then
            echo "::error::domain_1/domain_2 are only for a named Cloudflare tunnel, not '$APPLAB_TUNNEL'"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_TOKEN" ]; then
            echo "::error::a domain needs cloudflare_token: a quick tunnel is assigned a random hostname by Cloudflare, so apps could not be served under the one given"
            exit 1
          fi
        fi

    # The environment runs on the runner's own Docker daemon: kind creates nodes
    # as containers, and the registry is one too.
    - name: Install kind
      shell: bash
      run: |
        set -euo pipefail
        # Pinned, unlike the dsh action's "latest" assets: kind's cluster
        # bootstrap is version-sensitive, and a moving tag would change this
        # environment's behaviour without this repository changing.
        curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
        sudo install -m 0755 /tmp/kind /usr/local/bin/kind
        kind version

    - name: Install kubectl
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/kubectl \
          "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
        sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
        kubectl version --client

    - name: Install istioctl
      shell: bash
      run: |
        set -euo pipefail
        # Istio version pinned for the same reason as kind: the CRDs and the
        # gateway's Service shape are what applab's VirtualServices are written
        # against.
        curl -fsSL https://istio.io/downloadIstio | ISTIO_VERSION=1.24.2 sh -
        sudo install -m 0755 istio-1.24.2/bin/istioctl /usr/local/bin/istioctl
        istioctl version --remote=false

    - name: Install helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.4

    - name: Install the tunnel agent
      shell: bash
      env:
        APPLAB_TUNNEL: ${{ inputs.tunnel }}
      run: |
        set -euo pipefail
        if [ "$APPLAB_TUNNEL" = "cloudflare" ]; then
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
        else
          curl -fsSL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/ngrok
          ngrok --version
        fi

    # On masking, deliberately not done for the two API keys, and this is the one
    # place it is worth saying why.
    #
    # `::add-mask::` would be the reflex here, and it is the wrong tool for these
    # two values. The runner applies the secret masker to the step summary as well
    # as to the log — FileCommandManager.cs reads the GITHUB_STEP_SUMMARY file line
    # by line and runs each through SecretMasker.MaskSecrets before attaching it —
    # so masking a key redacts it from the very summary the key exists to be
    # delivered in. The run would end with two asterisks where the credential
    # should be, and the environment would be unreachable in practice: the console
    # asks for that key and nothing else ever shows it.
    #
    # What is left is not unmasked by accident. The other credentials this action
    # handles — registry_password, cloudflare_token, ngrok_token — arrive from
    # `secrets.*` in the calling workflow, and GitHub masks those automatically.
    # The registry password is the only one of them the script ever uses in a
    # command, and it goes to `docker login` on stdin rather than on the command
    # line.
    #
    # The two keys are the deliverable and are printed on purpose. What keeps them
    # out of the log by accident is not masking but how environment.sh builds
    # commands: it reads each key into a variable and refers to the variable,
    # because the ERR trap prints BASH_COMMAND — the *unexpanded* text of the
    # command that failed — so a key that reached a command as a variable
    # reference stays a reference in the failure message, while one built into the
    # command by concatenation would be printed in full. See verify_instance.
    - name: Start the environment
      shell: bash
      env:
        # APPLAB_VERSION is deliberately not set here, so the script falls
        # through to its own default: the published `latest`.
        APPLAB_API_KEY: ${{ inputs.api_key }}
        APPLAB_API_KEY_2: ${{ inputs.api_key_2 }}
        APPLAB_SESSION_HOURS: ${{ inputs.session_hours }}
        APPLAB_TUNNEL: ${{ inputs.tunnel }}
        APPLAB_DOMAIN_1: ${{ inputs.domain_1 }}
        APPLAB_DOMAIN_2: ${{ inputs.domain_2 }}
        CLOUDFLARE_TOKEN: ${{ inputs.cloudflare_token }}
        NGROK_TOKEN: ${{ inputs.ngrok_token }}
        # The registry, forwarded under the names the script reads. These three
        # were validated above and then not passed, so the credential the
        # workflow supplied never reached the script: it built a registry Secret
        # with empty fields and reported that no credential had been supplied,
        # for a run that had given it one. The input contract check in
        # .github/workflows/image.yml is what caught it.
        APPLAB_REGISTRY: ${{ inputs.registry }}
        APPLAB_REGISTRY_USERNAME: ${{ inputs.registry_username }}
        APPLAB_REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        APPLAB_RUNTIME_DIR: ${{ github.workspace }}/.applab-debugger
      run: |
        set -euo pipefail
        # The chart is used from the checked-out action, so the version being
        # tested and the chart installing it cannot come from different places.
        exec bash "${{ github.action_path }}/../hack/environment.sh"
