# Configuration for the Go SDK generated by openapi-generator.
#
# packageName is the Go *package* name — the identifier every generated file is
# declared with (`package applab`) — and nothing else. It is not the import path
# and it is not the module path, and setting it to either is a defect this tree
# shipped once:
#
#   packageName: github.com/shaowenchen/applab/sdk/golang
#
# makes every file begin `package github.com/shaowenchen/applab/sdk/golang`,
# which is not a sentence in Go and fails the compile with
#
#   syntax error: unexpected ., expected semicolon or newline
#
# The module path — what makes the tree importable as
# github.com/shaowenchen/applab/sdk/golang — is gitHost/gitUserId/gitRepoId below,
# which openapi-generator writes into go.mod as
# `module github.com/shaowenchen/applab` + "/" + packageName. So the two together
# are what the module path used to be on their own, and neither is a URL.
#
# The version tracks the API, not the AppLab release: this client is written
# against the v1 API and stays usable against any deployment serving it.
#
# hideGenerationTimestamp stops the generator stamping a date into every file, so
# two runs over one specification produce the same tree and the drift check can
# pass.
generatorName: go
packageName: applab
packageVersion: 0.1.0
hideGenerationTimestamp: true
# The module path, as gitHost/gitUserId/gitRepoId. The generator composes
# go.mod's `module` line from these plus packageName above, which is the only
# place the full import path is stated now — a consumer writes
# `github.com/shaowenchen/applab/sdk/golang`.
gitHost: github.com
gitUserId: shaowenchen
gitRepoId: applab/sdk/golang
# Interfaces make the client mockable in a caller's tests, which is the one
# generator option here that changes the API surface a user sees.
generateInterfaces: true
