# Configuration for the TypeScript SDK generated by openapi-generator.
#
# typescript-fetch rather than one of the axios-based generators: it has no
# runtime dependency at all. fetch is in every modern browser and in Node 18+, so
# the SDK works in either place without the caller installing anything — which is
# the whole point of shipping one, and the thing an axios client would take back.
generatorName: typescript-fetch
npmName: "@applab/sdk"
npmVersion: 0.1.0
# The version tracks the API, not the AppLab release — see the Python config for
# why the release number is deliberately not woven in.
supportsES6: true
typescriptThreePlus: true
hideGenerationTimestamp: true
disallowAdditionalPropertiesIfNotPresent: false
