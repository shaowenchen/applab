# Configuration for the Rust SDK generated by openapi-generator.
#
# Unlike the Python and TypeScript SDKs, this one has dependencies — and that is
# the language's doing rather than a choice. Rust's standard library has neither
# an HTTP client nor tar/gzip, so a client that talks to the API at all needs
# `reqwest` (with `serde_json` and, for the generated code, `tokio`), and the
# packaging helper needs `tar` and `flate2`. There is no "standard library only"
# version of this SDK to prefer; the honest thing is to say so here rather than
# let it be discovered at the first `cargo build`.
#
# `library: reqwest` is the generator's default and is left explicit so the
# dependency story above is not a surprise when the default eventually moves.
generatorName: rust
packageName: applab-sdk
# The version tracks the API, not the AppLab release — see the Python config for
# why the release number is deliberately not woven in.
packageVersion: 0.1.0
library: reqwest
# Without this the generator stamps a date into every file's header, the SDK tree
# differs on every run, and the drift check can never pass.
hideGenerationTimestamp: true
# Extra keys on a response are ignored rather than rejected, so the API may add a
# field without breaking a client generated before it existed.
disallowAdditionalPropertiesIfNotPresent: false
