# Configuration for the Python SDK generated by openapi-generator.
#
# Only the fields that matter here are set; everything else takes the generator's
# default. The two that are not defaults are the point of this file:
#
# packageName is the import name. It is applab_sdk rather than the generated
# default (which would be derived from the project name and can end up as
# `openapi_client`, a name that says nothing about what it talks to).
#
# hideGenerationTimestamp stops the generator stamping a date into every file's
# header. Without it the SDK tree differs on every run and the drift check can
# never pass — the classic way a generated artifact makes a repository noisy.
generatorName: python
packageName: applab_sdk
projectName: applab-sdk
# The version tracks the API, not the AppLab release: this client is written
# against the v1 API and stays usable against any deployment serving it. The
# release number is deliberately not woven in here — it moves every commit, and a
# generated tree whose version moved every commit would be one nobody could diff.
packageVersion: 0.1.0
hideGenerationTimestamp: true
library: urllib3
# Extra keys on a response are ignored rather than rejected. The API is free to
# add a field without breaking a client generated before it existed, which is the
# property that makes these SDKs safe to leave un-regenerated for a while.
disallowAdditionalPropertiesIfNotPresent: false
