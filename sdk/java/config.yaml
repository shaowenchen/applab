# Configuration for the Java SDK generated by openapi-generator.
#
# `library: native` is the point of this file. It makes the generated client use
# the JDK's own java.net.http.HttpClient, so the SDK has no runtime dependency at
# all — no OkHttp, no Jackson, no Gson. That is deliberately the same posture as
# the Python SDK (standard library only) and the TypeScript one (fetch and Node
# built-ins): a caller should be able to drop this SDK into a project and compile
# it without a dependency-resolution step that can fail.
#
# The packages are named rather than left to the generator so the hand-written
# helper (src/main/java/com/applab/sdk/AppLabExt.java) can sit in the same
# package the generated client lands in, and so an import in a caller's code is
# something a person would recognise.
generatorName: java
library: native
artifactId: applab-sdk
groupId: com.applab
apiPackage: com.applab.sdk.api
modelPackage: com.applab.sdk.model
invokerPackage: com.applab.sdk
# The version tracks the API, not the AppLab release — see the Python config for
# why the release number is deliberately not woven in. This client is written
# against the v1 API and stays usable against any deployment serving it.
artifactVersion: 0.1.0
# Without this the generator stamps a date into every file's header, the SDK tree
# differs on every run, and the drift check can never pass.
hideGenerationTimestamp: true
# Extra keys on a response are ignored rather than rejected, so the API may add a
# field without breaking a client generated before it existed.
disallowAdditionalPropertiesIfNotPresent: false
