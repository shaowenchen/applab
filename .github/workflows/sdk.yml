name: sdk

# Generate the language SDKs from the OpenAPI specification, check that what is
# committed matches it, and compile them.
#
# The SDKs are generated artifacts committed into this repository. They are
# committed rather than published so a reader can use one without waiting for a
# release pipeline, and they are generated rather than hand-written so they
# cannot be edited into disagreement with the API.
#
# Java is the one thing this workflow needs that a developer's machine here does
# not have. The specification itself is produced and checked by pure Go (see
# internal/openapi and cmd/genopenapi, run by `make check`), so a change to the
# API is caught locally; only the language trees below need the generator — and
# the compiling of them, which is why this job exists rather than a `make` target.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # sdk/** is deliberately NOT a trigger path. The generate job commits into
    # sdk/, and if that commit triggered this workflow the two would ping-pong
    # forever. The specification is what the SDKs are generated from, so it — not
    # its output — is what this listens for.
    paths:
      - api/openapi.yaml
      - sdk/*/config.yaml
      - sdk/*/.openapi-generator-ignore
      # The compile step is part of this job, so a change to what it runs has to
      # run it. Without this a broken compile check waits for an unrelated API
      # change to be noticed.
      - hack/sdk-compile.sh
      - .github/workflows/sdk.yml
  pull_request:
    paths:
      - api/openapi.yaml
      - sdk/**
      - internal/openapi/**
      - cmd/genopenapi/**
      - hack/sdk-compile.sh
      - .github/workflows/sdk.yml
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned to an exact version with a checksum. openapi-generator's output is not
  # identical across versions — enum ordering and formatting move between
  # releases — so an unpinned generator would make "the committed tree matches the
  # spec" fail on a day nobody changed anything. An upgrade is meant to be a
  # deliberate commit that regenerates and accepts the whole diff.
  GENERATOR_VERSION: 7.25.0
  GENERATOR_SHA1: 56a9bb79e3bb565f477eddca2c6daa288a9c6f35
  # The generators run over the same five languages everywhere in this file, so
  # the list is written once. apiDocs/modelDocs/apiTests/modelTests are off: the
  # generator otherwise writes a Markdown page per operation and a test per model,
  # which is most of the file count and none of what a reader wants.
  GENERATOR_FLAGS: >-
    --global-property apiDocs=false,modelDocs=false,apiTests=false,modelTests=false
  # "generator:directory" per language. The directory is also the config's home
  # (sdk/<dir>/config.yaml) and the ignore file's, so one name drives all three.
  LANGUAGES: >-
    python:python
    typescript-fetch:typescript
    go:golang
    java:java
    rust:rust

jobs:
  # On a push: regenerate from the specification, compile what was generated, and
  # commit the result. The compile step is what catches a specification change
  # that produces code which does not build — the one failure the drift check
  # cannot see, because a broken tree is still a tree that matches.
  generate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the generator
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${GENERATOR_VERSION}/openapi-generator-cli-${GENERATOR_VERSION}.jar"
          curl -fsSL -o /tmp/openapi-generator.jar "$url"
          echo "${GENERATOR_SHA1}  /tmp/openapi-generator.jar" | sha1sum -c -
          java -jar /tmp/openapi-generator.jar version

      - name: Generate the SDKs
        run: |
          set -euo pipefail
          for entry in $LANGUAGES; do
            gen="${entry%%:*}"; out="${entry#*:}"
            echo "::group::generate ${out} (${gen})"
            java -jar /tmp/openapi-generator.jar generate \
              -i api/openapi.yaml -g "$gen" -o "sdk/${out}" \
              -c "sdk/${out}/config.yaml" $GENERATOR_FLAGS
            echo "::endgroup::"
          done

      - name: Compile what was generated
        env:
          # Every toolchain is installed in this job, so a skip here means the
          # script has drifted rather than that a tool is missing.
          APPLAB_SDK_REQUIRE_ALL: "1"
        run: ./hack/sdk-compile.sh

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk
          if git diff --cached --quiet; then
            echo "the SDKs already match the specification"
            exit 0
          fi
          git commit -m "Regenerate the SDKs from api/openapi.yaml"
          git push

  # On a pull request: regenerate into a temporary directory and compare, so a
  # change to the specification that was not regenerated fails here rather than
  # landing a committed tree that disagrees with it.
  drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the generator
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${GENERATOR_VERSION}/openapi-generator-cli-${GENERATOR_VERSION}.jar"
          curl -fsSL -o /tmp/openapi-generator.jar "$url"
          echo "${GENERATOR_SHA1}  /tmp/openapi-generator.jar" | sha1sum -c -

      - name: Regenerate into a temporary tree
        run: |
          set -euo pipefail
          for entry in $LANGUAGES; do
            gen="${entry%%:*}"; out="${entry#*:}"
            # The generator reads .openapi-generator-ignore from its *output*
            # directory, and a fresh temporary directory has none — so it is
            # copied in first. Without this the temporary tree would contain the
            # go.mod, the per-model documentation and the test files the ignore
            # file excludes, and the comparison below would report every one of
            # them as drift.
            mkdir -p "${RUNNER_TEMP}/sdk/${out}"
            cp "sdk/${out}/.openapi-generator-ignore" "${RUNNER_TEMP}/sdk/${out}/"
            java -jar /tmp/openapi-generator.jar generate \
              -i api/openapi.yaml -g "$gen" -o "${RUNNER_TEMP}/sdk/${out}" \
              -c "sdk/${out}/config.yaml" $GENERATOR_FLAGS
          done

      - name: Compare with what is committed
        run: |
          set -euo pipefail
          status=0
          # -x FILES: the generator records what it owns in .openapi-generator/FILES,
          # and that list carries the generator version. A version bump changes it
          # without changing a line of the API, so comparing it would report drift
          # that is only an upgrade — the committed tree is expected to differ there
          # exactly once, in the commit that bumps the pin above.
          #
          # -x <each hand-written helper>: those files are not the generator's to
          # produce, so the temporary tree does not contain them and diff would
          # report every one as "only in sdk/<lang>". Each is named exactly as it
          # appears — the Go helper is a directory, the others are single files,
          # and the names differ by language, so they cannot be matched by one
          # pattern.
          for entry in $LANGUAGES; do
            out="${entry#*:}"
            if ! diff -r -x FILES \
                 -x applabext -x applab_ext.py -x applabExt.ts -x AppLabExt.java -x applab_ext.rs \
                 "${RUNNER_TEMP}/sdk/${out}" "sdk/${out}"; then
              echo "::error::sdk/${out} is out of date with api/openapi.yaml; run the sdk workflow (or 'make gen-openapi' then regenerate) and commit the result"
              status=1
            fi
          done
          exit $status
