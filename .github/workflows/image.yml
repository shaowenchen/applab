name: image

# Check the commit, then build the image.
#
# The checks live here rather than in a workflow of their own because `image`
# depends on them: a workflow cannot depend on a job in another file, so the gate
# has to be inside one. A red check stops the image from being built, which is
# the point.
#
# Every change builds an image, not only a tag. A build that is never exercised
# until the day a release is cut is a build whose Dockerfile has been free to rot
# — and the tag is not what makes an image worth having, the commit in it is. A
# branch push is published under its commit; a tag is published under its version
# as well, which is what makes it a release.
#
# A pull request builds but does not publish: the Dockerfile is worth validating
# on every change, and a fork's pull request has no secrets to log in with.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancelled rather than queued: an earlier push's answer is irrelevant once a
# newer one exists, and the checks now run on every push.
#
# A release is safe from that because the ref is part of the group — a tag push
# is `refs/tags/v0.1.0` and a branch push is `refs/heads/master`, so they never
# share a group and a branch push cannot cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: applab

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than hardcoded: a toolchain mismatch between CI
          # and the module is a failure that looks like a code problem.
          go-version-file: go.mod
          cache: true

      # The release binary comes from the same script the developer runs, so
      # there is one answer to "which helm is this checked with".
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # fmt-check, vet and the test suite. The route-table tests are the ones
      # that matter most here: GET /api/v1/describe serves the endpoint list
      # clients are built from, and it is generated from the table the mux is
      # configured with — so a route added without a description, or one served
      # without the auth it should have, fails here rather than shipping.
      - name: make check
        run: make check

      # Renders the chart and asserts what it has to contain. Skipped by the
      # script itself if helm were missing, which is why helm is installed above.
      - name: check the chart
        run: ./hack/helm-check.sh

      # The console is plain JavaScript inside an HTML file, so nothing else
      # parses it — a syntax error would reach a browser before it reached CI.
      - name: Console JavaScript parses
        run: |
          set -eux
          python3 - <<'PY'
          import re, subprocess, sys
          html = open('internal/console/static/index.html').read()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          if not m:
              print('no <script> block found in the console page', file=sys.stderr)
              sys.exit(1)
          open('/tmp/console-check.js', 'w').write(m.group(1))
          subprocess.run(['node', '--check', '/tmp/console-check.js'], check=True)
          PY

      # action.yml declares inputs and environment.sh reads them. A typo means an
      # input that silently does nothing, which a run only reveals an hour later.
      # Modelled on the equivalent check in debugger-deepseek-harness.
      - name: The debugger action declares what the script reads
        run: |
          set -eux
          python3 - <<'PY'
          import re, sys, yaml

          action = yaml.safe_load(open('debugger/action.yml'))
          declared = set(action['inputs'])

          steps = [s for s in action['runs']['steps']
                   if 'environment.sh' in str(s.get('run', ''))]
          if len(steps) != 1:
              print(f'expected exactly one step running environment.sh, found {len(steps)}', file=sys.stderr)
              sys.exit(1)

          passed = set()
          for value in steps[0].get('env', {}).values():
              m = re.fullmatch(r'\$\{\{\s*inputs\.([a-z0-9_]+)\s*\}\}', str(value))
              if m:
                  passed.add(m.group(1))

          problems = []
          missing = declared - passed
          if missing:
              problems.append(f'inputs declared but never passed to the script: {sorted(missing)}')
          # The other direction is not checked: APPLAB_GATEWAY_* and friends are
          # passed as literals by the script itself, not as action inputs.

          # Every input the script reads must be one the action can supply, or a
          # user can set an input that reaches nothing — or the script reads a
          # variable no caller can ever set.
          script = open('hack/environment.sh').read()
          read = set(re.findall(r': "\$\{(APPLAB_[A-Z_]+):=', script))
          supplied = {f'APPLAB_{name.upper()}' for name in declared}
          # Set from the workflow or the script's own context, not from an input.
          #
          # APPLAB_VERSION and APPLAB_BUILD_ROOTLESS are here because they used to
          # be inputs and are deliberately no longer: the image tag is always the
          # published `latest`, and builds are always rootless. That is a
          # deliberate loss of a knob — a host that refuses unprivileged user
          # namespaces can no longer be worked around from the launch form, and
          # the way out is `build.rootless=false` on the chart, which the chart's
          # README documents. Named here so the check keeps failing for a variable
          # nobody meant to fix, rather than being relaxed for the two that were.
          #
          # The object store's variables are here for the other reason. The
          # launcher starts MinIO itself, on the runner, and hands AppLab the
          # address of the container it started — there is nothing meaningful for
          # an operator to point at an input, the way there is for `domain` or
          # `tunnel`. They were added to the script without being added here, and
          # this check failed on every run between then and now: a red gate that
          # had nothing to say about the commit it was reporting on.
          #
          # Adding a variable here is the moment to ask whether it is really
          # infrastructure the script owns, or a knob someone would want. The
          # second is an input, and putting it here instead is how a launch form
          # quietly stops being able to configure the thing it launches.
          internal = {'APPLAB_RUNTIME_DIR', 'APPLAB_NAMESPACE', 'APPLAB_PATH_PREFIX',
                      'APPLAB_IMAGE_REPOSITORY', 'APPLAB_CLUSTER_NAME', 'APPLAB_REGISTRY_NAME',
                      'APPLAB_REGISTRY_PORT', 'APPLAB_REGISTRY', 'APPLAB_GATEWAY_NODEPORT',
                      'APPLAB_PUBLIC_HOST', 'APPLAB_INSTALL_TIMEOUT_SECONDS',
                      'APPLAB_VERSION', 'APPLAB_BUILD_ROOTLESS',
                      # The object store: a container this script starts, on a
                      # port it picks, with a credential it generates.
                      'APPLAB_OBJECT_STORE_NAME', 'APPLAB_OBJECT_STORE_PORT',
                      'APPLAB_OBJECT_STORE_BUCKET', 'APPLAB_OBJECT_STORE_ENDPOINT',
                      'APPLAB_OBJECT_STORE_ACCESS_KEY', 'APPLAB_OBJECT_STORE_SECRET_KEY',
                      'APPLAB_OBJECT_STORE_IMAGE', 'APPLAB_OBJECT_STORE_CLIENT_IMAGE'}
          unreachable = read - supplied - internal
          if unreachable:
              problems.append(f'environment.sh reads variables no input can set: {sorted(unreachable)}')

          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          print(f'{len(declared)} inputs declared, all forwarded; {len(read)} variables read, all settable')
          PY

  image:
    name: image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A pull request builds the Dockerfile but does not push: a fork's pull
      # request has no secrets to log in with, and publishing an unreviewed build
      # is not something a pull request should be able to do. So both logins and
      # the push itself are skipped there.
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Run the image before it is pushed, because "it built" is not "it runs".
      #
      # Everything that differs between a built image and a running one was
      # unverified by this workflow, and two defects reached a cluster that way:
      # a chmod on the data directory that fails for a process that does not own
      # the mounted volume, and git-http-backend missing from the image because
      # Alpine ships it in a separate package. The Go tests run against a working
      # copy on a machine where both problems are absent; helm-check.sh asserts
      # what the chart renders, not what the image contains. Running it is the
      # only check that can see either.
      #
      # Single-architecture and loaded locally, because the smoke test starts a
      # container — the multi-arch build below produces a manifest that cannot be
      # run. Built before the push so a failure stops the image from going out.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: applab-smoke:local
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: The image runs
        run: ./hack/image-smoke.sh applab-smoke:local

      # The tags are derived from the git ref rather than taken on trust, and the
      # version stamped into the binary is the same string a user sees on the
      # image — so "which build is this" has one answer.
      #
      # Every build is tagged with its commit, because that is what a branch push
      # publishes: an image whose only tag were `latest` would be a build nobody
      # could point at. A tag additionally gets its version, which is what makes
      # one a release.
      #
      # The chart's version is also published, and it is not optional. The chart
      # defaults an unset `image.tag` to its own version, so a chart with no
      # counterpart image here is a chart that installs and then cannot pull
      # anything. That is not hypothetical: the two were derived separately, the
      # image went out as `sha-6ac4468` while the chart asked for `6ac4468`, and
      # every install that did not override the tag — including the one in the
      # chart's own README — pulled nothing. `hack/chart-version.sh` is now the
      # one place that decides, and the chart job reads the same script.
      #
      # Two destinations, one build. An image goes to Docker Hub and to ACR,
      # because a cluster that cannot reach the first can usually reach the
      # second — and an installation that has to build AppLab itself to run it is
      # not an installation anybody completes.
      #
      # ACR's repository lives under a namespace, `opshub/<name>`, while Docker
      # Hub's is flat: `shaowenchen/applab`. That is why the two are spelled out
      # rather than one being derived from the other.
      #
      # The Docker Hub path is written out rather than built from
      # secrets.DOCKERHUB_USERNAME: where an image lives is a fact about this
      # project, not a credential, and deriving it from a secret would mean an
      # unset secret silently publishes somewhere else. ACR_REPOSITORY keeps a
      # default for the same reason the other projects in this account do — the
      # variable is there to redirect the mirror, not to be required.
      - name: Derive the version
        id: version
        run: echo "version=$(./hack/chart-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/shaowenchen/${{ env.IMAGE_NAME }}
            registry.cn-beijing.aliyuncs.com/${{ vars.ACR_REPOSITORY || 'opshub/shaowenchen-applab' }}
          tags: |
            # sha- is the one every build gets, tag or not.
            type=sha,prefix=sha-,format=short
            # The chart's own version, which is what its default image tag asks
            # for: `0.1.0-dev` on a branch, the release version on a tag.
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: a Kubernetes cluster is rarely all one
          # architecture, and an image that only runs on one is a puzzle for
          # whoever lands on the other.
          platforms: linux/amd64,linux/arm64
          # Built everywhere, pushed only where it may be: a pull request
          # validates the Dockerfile without needing a credential.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ACR rejects Buildx's provenance and SBOM attestations, failing the
          # push with an empty OCI manifest class rather than anything that names
          # the cause. Off for both, since this is one build pushed twice — and
          # neither AppLab's Dockerfile nor its consumers use them.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          # Layer caching across runs. Without it every build rebuilds the Go
          # module download and the whole binary from nothing.
          cache-from: type=gha
          cache-to: type=gha,mode=max
