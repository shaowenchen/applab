# Start a complete AppLab test environment by hand and get a link.
#   gh workflow run debugger.yml
#
# The run's Summary carries the console link and the API key. Push an app with
# the printed recipe and it is built, deployed and served — the whole platform,
# on a throwaway cluster, torn down when the run ends.
#
# Manual only, deliberately. It holds a runner for the whole session and starts
# a real cluster, a registry and a gateway, which is far too much to spend on
# every push — and the checks that run on every push are what image.yml is for.
name: debugger

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Duration(hours)'
        type: choice
        # Drives both the environment's own deadline and this job's timeout, so
        # the two cannot drift apart. `unlimited` is passed on as 0, which the
        # script reads as "no self-imposed limit"; the job still ends at the
        # runner's ceiling, since nothing here can outlive a GitHub-hosted job.
        default: '4'
        options:
          - '1'
          - '2'
          - '4'
          - 'unlimited'
      tunnel:
        description: 'Tunnel'
        type: choice
        # Cloudflare by default: a quick tunnel needs no account and no secret,
        # so a run works out of the box.
        default: 'cloudflare'
        options:
          - 'cloudflare'
          - 'ngrok'
      domain:
        description: 'Domain (empty = a quick tunnel''s own hostname)'
        type: string
        # Free text, so a run can serve any hostname the caller has a Cloudflare
        # tunnel for, rather than only the two this repository happens to be set
        # up with. It becomes ingress.host and is used as given; the ingress
        # that points the name at the tunnel is arranged in Cloudflare, and
        # nothing here can create or check it.
        #
        # Named rather than empty so a run serves a domain that was chosen, not
        # a hostname minted for that one connection — which means the named
        # tunnel is the expected path, and a run with this set and no
        # CLOUDFLARE_TOKEN stops rather than quietly publishing a quick
        # tunnel's address instead. Set it empty on purpose to take that quick
        # tunnel.
        default: 'applab-1.chenshaowen.com'
      api_key:
        description: 'API key (empty = the ADMIN_KEY secret, then a random one)'
        type: string
        # An override, not the usual way in. Left empty — the normal case — the
        # run takes the ADMIN_KEY secret if the repository has one, and
        # generates a key with openssl if it does not. Fill it in to use a
        # particular key for this one run instead.
        #
        # Plain text rather than a secret name, and that is deliberate: the key
        # is the thing the run hands back, and hack/environment.sh prints it in
        # the summary whether it generated it or was given it — so hiding the
        # input that chooses it would hide nothing a reader of the run could not
        # already see.
        #
        # There is one secret, not one per domain. A key is not tied to a
        # hostname: it is a value in the installation's own Secret, so the same
        # one works for whatever domain this run serves. Two of them existed
        # only because the domain used to pick which to read.
        default: ''

permissions:
  contents: read

concurrency:
  # The kind cluster and the gateway's node port both claim fixed names and
  # ports on the runner, so only one environment runs per repository. A manual
  # environment can be up for hours, and two at once would collide on those
  # names.
  group: applab-debugger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  debugger:
    runs-on: ubuntu-latest
    # A little longer than the environment's own deadline, so the script's
    # cleanup runs rather than the job being killed at the ceiling. The margin
    # covers boot: the kind cluster plus Istio is about ten minutes on a cold
    # runner, and the build of the first app adds a couple more.
    #
    # Written as a literal comparison chain rather than
    # `unlimited && 360 || fromJSON(session_hours) * 60 + 30`: `fromJSON('unlimited')`
    # is not valid JSON, so if the evaluator reached it the whole workflow would
    # fail to start. Every operand here is a literal, so nothing is evaluated
    # speculatively.
    timeout-minutes: ${{ inputs.session_hours == 'unlimited' && 360 || inputs.session_hours == '4' && 280 || inputs.session_hours == '2' && 160 || 100 }}
    steps:
      - uses: actions/checkout@v4

      # The action is called from the working copy (`uses: ./`), so the chart
      # and the orchestration script are both this commit's.
      - uses: ./action
        with:
          # session_hours and tunnel are the two choices worth offering at launch.
          # The rest are fixed by the action, or by the script's own defaults.
          session_hours: ${{ inputs.session_hours == 'unlimited' && '0' || inputs.session_hours }}
          tunnel: ${{ inputs.tunnel }}
          # Secrets, not inputs: a workflow input is plain text any reader of the
          # run can see, and these are credentials.
          cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          # The registry the built apps are pushed to and pulled from. The same
          # token authenticates both, which is why there is one and not two.
          registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          # The domain is an input — it is not sensitive, and it is the thing a
          # person picks.
          domain: ${{ inputs.domain }}
          # A dispatched key wins; the ADMIN_KEY secret is the fallback before a
          # generated one — see where the input is declared. The secret is what
          # makes a run land on the same key every time without anyone retyping
          # it; a dispatched value is the one-run override.
          #
          # No value is refused here. There used to be one: a placeholder the
          # dispatcher sent when it had no key of its own. That placeholder is
          # gone from the dispatcher, so a dispatched key is now taken as given
          # — and the generator below is what covers an empty input.
          api_key: ${{ inputs.api_key || secrets.ADMIN_KEY }}

