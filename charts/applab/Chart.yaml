apiVersion: v2
name: applab
description: Deploy an application to Kubernetes by uploading its source

type: application

# The chart version tracks the chart's own shape; appVersion tracks AppLab.
# They move independently: a values change is a chart bump, a new AppLab release
# is an appVersion bump.
version: 0.1.0
appVersion: "0.1.0"

icon: https://www.chenshaowen.com/logo.png

sources:
  - https://github.com/shaowenchen/applab

maintainers:
  - name: shaowenchen
    email: mail@chenshaowen.com

keywords:
  - paas
  - idp
  - kubernetes
  - gitops
  - kaniko
