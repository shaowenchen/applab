{{- include "applab.validate" . -}}
{{- if .Values.build.enabled }}
{{/*
Stated on the Deployment on purpose: it is a property of every build this
installation runs, and an operator should not have to read the build engine's
source to learn that a build executes its Dockerfile as root.

This is emitted as a YAML comment rather than as bare text. Bare text lands at
the top of the document and becomes a field of the Deployment — the manifest
still parses as YAML, so the mistake is invisible until the API server rejects
it for an unknown field.
*/}}
# NOTE: build.enabled is true, so builds run as root in their own containers.
# That is kaniko's design and it has no unprivileged mode: it unpacks the base
# image into its own root filesystem and runs each Dockerfile step there. The
# build is still one unprivileged container — no privileged flag, no host
# mounts, no API token — but a build runs code from whoever pushed the source,
# and that code is root within its own container.
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "applab.fullname" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Rolling rather than Recreate. There is no volume to detach from one pod
  # before the next can start: AppLab holds nothing but the bucket, which any
  # number of replicas can use at once.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "applab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A hash of the configuration, so a values change that only affects the
        # environment rolls the pods. Without it a key rotation or a registry
        # change would sit in the Secret while the running pods kept the old one.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "applab.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "applab.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: applab
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            # The keys live here rather than in the ConfigMap, which is readable
            # by anyone with get on the namespace.
            - secretRef:
                name: {{ include "applab.secretName" . }}
            # The bucket's credential, separately, so rotating it does not mean
            # rewriting the API keys beside it.
            - secretRef:
                name: {{ include "applab.objectStoreSecretName" . }}
            - configMapRef:
                name: {{ include "applab.fullname" . }}-config
          volumeMounts:
            # Scratch space, and only that. A repository is copied here while
            # git runs against it and removed afterwards; nothing durable is
            # written to it, so losing it costs nothing and it needs no volume.
            - name: scratch
              mountPath: /data
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          # A generous startup budget: the first start reconciles builds
          # interrupted by a previous process, and the readiness probe would
          # otherwise restart the pod part-way through.
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        # Everything AppLab persists is in the bucket, so this holds nothing when
        # the pod is not running — which is what lets a replica be replaced at
        # any moment. A sizeLimit bounds what a repository materialised for a
        # clone can take; without one, a large enough repository would fill the
        # node's disk.
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratchSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
