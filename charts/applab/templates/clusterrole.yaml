{{- if .Values.rbac.create }}
{{/*
applab creates a namespace per app and manages objects inside it, so a namespaced
Role is not enough: the namespaces it manages do not exist at install time and
are not the release namespace.

Every rule below is used. The alternative — binding cluster-admin, which is what a
platform like this is often given — would let a compromise in applab, or a bug in
its namespace handling, reach workloads it has nothing to do with. The cost of
scoping it properly is this list.

It is a ClusterRole with a ClusterRoleBinding rather than a namespaced Role
because the resources genuinely span namespaces. applab confines itself to
namespaces carrying its configured prefix, which is enforced in code (see
internal/k8s) — a ClusterRole cannot express "only namespaces named like this".
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "applab.fullname" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
rules:
  # Namespaces: creating and deleting an app's namespace is how an app is
  # provisioned and how deletion is made complete.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # The app's workload and how it is reached.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # One Job per build, plus the Secret carrying that build's single-use source
  # token. The token is how a build authenticates without holding an API key.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]

  # Reading a build's state and its log, which is what makes a failed build
  # diagnosable. pods/log is a separate resource and has to be granted explicitly.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Events are what explain a pod that never started — a failed scheduling, an
  # image pull that was refused.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "applab.fullname" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "applab.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "applab.serviceAccountName" . }}
    namespace: {{ include "applab.namespace" . }}
{{- end }}
