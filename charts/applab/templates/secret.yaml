{{- if not .Values.auth.existingSecret }}
{{/*
The API keys. A key is the whole identity on the server — there is no user store
— and a key that authenticates can also delete, so this Secret is the most
sensitive object in the release.

An existing Secret is preferred in a real deployment (`auth.existingSecret`):
values are stored in plain text in the release's history and are frequently kept
in version control.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "applab.fullname" . }}-auth
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The server parses this as a comma-separated list, so a single key is the
  # list of one. More than one is what auth.existingSecret is for: values are
  # stored in plain text in the release, and a Secret you manage is not.
  APPLAB_KEYS: {{ .Values.auth.key | quote }}
{{- end }}
