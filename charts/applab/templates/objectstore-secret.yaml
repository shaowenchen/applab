{{- if not .Values.objectStore.existingSecret }}
{{/*
The bucket's credential.

It is a Secret of its own rather than a field in the auth Secret beside it,
because the two have different lifetimes: the API keys are what people hold and
are rotated when someone leaves, and this is what AppLab itself uses and is
rotated when the bucket's policy says so. Putting them together would mean
rotating one by rewriting the other, and would make one existingSecret setting
unable to apply to either.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "applab.objectStoreSecretName" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
type: Opaque
stringData:
  APPLAB_OBJECT_STORE_ACCESS_KEY: {{ .Values.objectStore.accessKey | quote }}
  APPLAB_OBJECT_STORE_SECRET_KEY: {{ .Values.objectStore.secretKey | quote }}
{{- end }}
