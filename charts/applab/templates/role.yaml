{{- if .Values.rbac.create }}
{{/*
applab runs in one namespace and keeps every app it deploys there too, so a
namespaced Role is enough. That is the point of this file.

The alternative — a ClusterRole, which is what a platform like this is usually
given — would let a compromise in applab, or a bug in its handling of namespaces,
reach every workload in the cluster. With a Role bound in one namespace, the
worst it can do is what it would do anyway.

Each rule below is used; nothing is granted for future convenience:
  - Deployments, Services and VirtualServices are an app.
  - Jobs are builds (the app key a build clones with is an environment variable
    on the Job, not an object of its own).
  - Pods and pods/log are how a build's log and an app's log are read.
  - Events are what explain a pod that never started.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "applab.fullname" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
rules:
  # The app's workload and how it is reached.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Istio's VirtualService is how an app is published: the cluster routes through
  # a gateway, and an Ingress would be ignored by it.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # One Job per build, and the same permission is what the pre-delete cleanup
  # uses to remove them when the release is uninstalled. A Job's pod carries an
  # app key in its environment, so a build Job left behind by an uninstall is a
  # credential left behind with it.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Deleting an app lists and removes everything carrying its label, and that
  # sweep covers Secrets. applab no longer creates any — the key a build clones
  # with is an environment variable on the Job, and an app's API key and its
  # secrets live in the object store — but deletions still name the kind, so an
  # installation upgraded from a version that did create them has them removed
  # with the app rather than left behind as live credentials for an app that no
  # longer exists.
  #
  # Nothing else here writes a Secret, so this is a permission held for the sake
  # of cleanup. It is worth removing together with the sweep, in one change, when
  # no installation predating it is expected to be upgraded.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]

  # Reading a build's state and its log, which is what makes a failed build
  # diagnosable. pods/log is a separate resource and has to be granted explicitly.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Events are what explain a pod that never started — a failed scheduling, an
  # image pull that was refused.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # What the running pods are using, for the resource panel. This is a separate
  # API group served by metrics-server rather than by the kube-apiserver, so it
  # needs its own rule — and it is the one rule here that may have nothing behind
  # it: a cluster without metrics-server answers 404 for the whole group, and the
  # panel then reports usage as unavailable while still showing the limits. Get
  # and list only; applab never writes a metric.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "applab.fullname" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "applab.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "applab.serviceAccountName" . }}
    namespace: {{ include "applab.namespace" . }}
{{- end }}
