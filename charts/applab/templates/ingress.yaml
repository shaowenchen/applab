{{/*
How a person reaches applab itself — the console and the API.

This is deliberately a plain Ingress and not the Istio gateway apps go through:
it is one hostname for the platform, fronted by whatever ingress controller the
cluster already runs. Apps are published separately, by a VirtualService
attached to the gateway in deploy.gateway.

A cluster with no ingress controller sets ingress.enabled=false and gets the
console on the gateway instead, from console-virtualservice.yaml.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "applab.fullname" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "applab.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
