{{/*
How a person reaches applab itself — the console and the API.

This is deliberately a plain Ingress and not the Istio gateway apps go through:
it is one hostname for the platform, fronted by whatever ingress controller the
cluster already runs. Apps are published separately, by a VirtualService
attached to the gateway in deploy.gateway.

A cluster with no ingress controller sets ingress.enabled=false and gets the
console on the gateway instead, from console-virtualservice.yaml.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "applab.fullname" . }}
  namespace: {{ include "applab.namespace" . }}
  labels:
    {{- include "applab.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /*
          A host with no paths means the root, which is the only thing it can
          reasonably mean: an Ingress rule with an empty path list is rejected by
          the API server, and nothing else a caller could want is expressible by
          a host on its own.

          It is defaulted rather than required because of how `--set` works on a
          list. `--set ingress.hosts[0].host=example.com` reads like setting one
          field but replaces the whole element, so the paths this chart's
          values.yaml supplies under it disappear — and the caller, who asked for
          a hostname, gets an API server error about a field they never
          mentioned. Defaulting makes the obvious spelling do the obvious thing.
          */}}
          {{- if .paths }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "applab.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "applab.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
