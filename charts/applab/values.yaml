# Default values for applab.
#
# AppLab deploys applications to Kubernetes. It is given a URL and a key, and it
# stores source, builds images and runs the result. Read the notes on `build` and
# `ingress.host` before deploying: both have prerequisites that are easier to
# satisfy before the first install than after.

# Override the chart's name, and the release name it is combined with.
nameOverride: ""
fullnameOverride: ""

# Namespace AppLab itself runs in. Defaults to the release namespace.
namespaceOverride: ""

image:
  repository: docker.io/shaowenchen/applab
  # Defaults to the chart's own version when empty, which is the tag the image
  # is published under: installing chart 0.1.0-dev runs image 0.1.0-dev. The two
  # are the same string by construction, so the default is one that exists —
  # which it was not while this defaulted to appVersion, since that carries the
  # commit and no image was ever published under it.
  tag: ""
  # Always, deliberately. Nothing here is immutable: a tag can be re-pushed, and
  # a node that already has that tag would keep running the old image. The
  # pull is cheap and the alternative is a deploy that reports success while
  # serving the previous build. It is also what makes a moving tag like
  # 0.1.0-dev safe to serve.
  pullPolicy: Always

imagePullSecrets: []

# How many AppLab pods to run.
#
# More than one works, because a replica holds nothing: every app, every
# repository and all the history are in the bucket. Raise it for availability
# rather than for throughput — the work AppLab does is small, and the load is
# whatever the API sees.
#
# One caveat, and it is the only one: two replicas writing the same app's
# repository at the same instant can lose one of the two writes, because the
# lock that serialises them is per process. In practice that means two pushes to
# one app arriving at the same moment; a push is a rare event, and the next
# build reads what git actually has.
replicaCount: 1

# ---------------------------------------------------------------------------
# Authentication
#
# There are two tiers of key, and the difference is reach.
#
# The key set here is an *admin* key. A key that authenticates can do anything
# this installation can — including delete every app it manages — so treat it as
# a credential that can destroy data, and give it to nobody you would not give
# the installation to. One key is enough to install with.
#
# To give several people their own key — so one can be revoked without
# disturbing the others — use `auth.existingSecret` below rather than a second
# value here: the Secret it names carries the comma-separated list, and revoking
# is removing an entry and upgrading.
#
# Every app additionally gets a key of its own, created by AppLab when the app is
# created and kept in the object store under the app's own directory. An app key
# reaches that app and nothing else: it can push, build, deploy and roll back,
# but cannot delete the app. That is the credential to give whoever deploys an
# app, so they never hold one that can destroy the installation. Nothing here
# configures them — see the README's "Keys" section.
# ---------------------------------------------------------------------------
auth:
  # Generate with: openssl rand -hex 32
  key: ""

  # Use an existing Secret instead of the one this chart creates. It must carry
  # an "APPLAB_KEYS" key whose value is the comma-separated list — the same key
  # this chart writes — and it must live in the release namespace. Prefer this
  # in a real deployment: it keeps keys out of the release's values, which are
  # stored in plain text in the cluster and often in version control. It is also
  # how a deployment carries more than one key.
  existingSecret: ""

# ---------------------------------------------------------------------------
# Apps
# ---------------------------------------------------------------------------
apps:
  # Serves every app from one host under one path, instead of giving each app
  # its own subdomain: with pathPrefix "/apps" and the default ingress.path of
  # "/applab", an app with id "shop" is served at
  # <ingress.host>/applab/apps/shop.
  #
  # The apps are nested under ingress.path, because that is the path the gateway
  # routes on. A route written outside it would be one nothing ever delivers to.
  #
  # Setting this requires ingress.enabled=false. An app on a prefix is served by
  # its own VirtualService on the gateway, and an Ingress routes on a path
  # without being able to strip one — so an Ingress on "/applab" would match the
  # apps' own path and deliver their traffic to applab itself, which answers with
  # the console. The chart refuses the combination rather than deploying apps
  # that cannot be reached.
  #
  # The reason to want this is the certificate. A subdomain per app needs a
  # wildcard DNS record and a wildcard certificate, and both have to be reissued
  # as the deployment grows. One host and one path prefix needs neither, so a
  # single ordinary certificate covers any number of apps.
  #
  # What it costs: every app now shares an origin. A browser's per-origin limits
  # and its cookies are shared between apps, and two apps cannot both own "/".
  # This is the right trade when the alternative is a wildcard certificate and
  # the wrong one when the apps are meant to be genuinely separate sites.
  #
  # AppLab strips the prefix before the request reaches the app, so an app sees
  # the paths it would see at a root and needs no change to work here. It also
  # sets X-Forwarded-Prefix, which an app that honours it can use to build
  # correct absolute links.
  pathPrefix: ""

  # An app's own configuration is not set here. It is per app rather than per
  # installation, and it is changed while the deployment runs, so it is managed
  # with `applab env` rather than with a release:
  #
  #   applab env set shop LOG_LEVEL=debug          # plain, visible in the Deployment
  #   applab env secret set shop DATABASE_URL=...  # never returned by any endpoint
  #
  # Both kinds live in the app's own record in the bucket, and both reach the
  # container the same way: AppLab writes them into the Deployment's `env`. No
  # Kubernetes Secret is involved, which means a secret's value is readable by
  # anyone who can read the Deployment — `kubectl get deploy -o yaml` included.
  # The API still never returns a value, only its name.
  #
  # Changes take effect on the next deploy.

  # The public address of this AppLab installation, used by build jobs to clone
  # source from and reported to clients as api_base_url.
  #
  # Leave empty to use the in-cluster Service, which is correct when builds run
  # in the same cluster and the ingress is not reachable from inside it — the
  # usual case. The Ingress path is appended to it, so that a deployment served
  # under one has a build address that names the same path the server answers
  # on; without that a build asks for /git/<app>.git at the root of a server
  # that only serves /applab, and every clone fails with a 404.
  #
  # Set it when a build must reach AppLab through an external address. What is
  # set here is then the whole address, path included — nothing is appended,
  # since this is the operator saying what the address is.
  baseURL: ""

# ---------------------------------------------------------------------------
# Uninstall
#
# `helm uninstall` deletes the objects the chart created and nothing else. The
# apps and the build Jobs were created by AppLab at runtime, through the
# Kubernetes API, so Helm has never seen them — without this they outlive the
# uninstall, still serving, with an app's key in every build Job's pod
# environment.
# ---------------------------------------------------------------------------
cleanup:
  # Remove them before the release goes. Runs as a pre-delete hook, because the
  # hook needs the release's own ServiceAccount and Role and Helm deletes those
  # along with everything else — a post-delete hook would find itself with no
  # permission to remove anything.
  #
  # Set false only if you mean to keep the apps running after removing AppLab;
  # there is then nothing left that knows how to remove them, and every one has
  # to be deleted by hand.
  onUninstall: true

  # How long the hook may take before Helm gives up on it. Deletion is
  # asynchronous, so the hook waits for the apps' pods to stop rather than
  # returning as soon as the deletes are issued.
  timeout: 120

  # The hook's resource bounds. It lists and deletes; it does not build anything.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Build pipeline
#
# AppLab can run without this: source storage, the API and the console all work,
# and apps can be deployed from images built elsewhere. With it, pushing source
# builds an image in the cluster.
#
# Builds run as a Job per build: kaniko clones the app's repository at one
# commit, runs its Dockerfile, and pushes the image. There is no daemon and no
# privileged helper — but kaniko has no unprivileged mode, so a build runs as
# root inside its container. See the README's prerequisites.
# ---------------------------------------------------------------------------
build:
  enabled: true

  # Where built images are pushed. Required when enabled.
  #
  # How the image is named depends on how much path the registry has, because a
  # repository can only be extended so far before the registry rejects it:
  #
  #   registry.example.com/apps  ->  registry.example.com/apps/<app>:<commit>
  #   registry.example.com       ->  registry.example.com/<app>:<commit>
  #   shaowenchen                ->  shaowenchen/<app>:<commit>
  #   shaowenchen/applab         ->  shaowenchen/applab:<app>-<commit>
  #
  # With no path or one segment, an app gets a repository of its own under the
  # prefix; with two or more the path is already as deep as it can go, so the app
  # moves into the tag. A cluster-local registry (registry:2 in-cluster) works;
  # a hosted one needs credentials, see build.secret.
  registry: ""

  # Registry-side layer cache, as a repository per app under <prefix>. A Job has
  # no persistent disk, so without this every build starts from nothing.
  #
  # Costs one extra image per app in the registry, and repays it on the second
  # build of anything with more than a trivial Dockerfile. Empty disables it.
  cacheRepoPrefix: ""

  # The kaniko image a build runs. Pinned rather than "latest": a moving tag
  # would change a build's behaviour without AppLab changing.
  #
  # This is the maintained community build of kaniko — Google's
  # GoogleContainerTools/kaniko was archived in June 2025 and its images are no
  # longer published. It is the same executor, and it is published for amd64 and
  # arm64.
  #
  # The node pulls this image, so a cluster that cannot reach ghcr.io needs it
  # mirrored and this set to the mirror. The `-debug` tag of the same version
  # additionally carries a shell, which makes a failed build inspectable; the
  # plain tag is a smaller image for the same executor.
  kanikoImage: "ghcr.io/osscontainertools/kaniko:v1.26.2"

  # Let the build talk to a registry over plain HTTP, and skip TLS verification.
  #
  # It exists for a cluster-local registry: one served over HTTP, or with a
  # self-signed certificate no node trusts. Those are exactly the registries a
  # test environment uses, and the ones a public one never is.
  #
  # It covers both directions — pulling the base images and pushing the result —
  # because a registry reachable only one way would fail in the middle of a build
  # rather than at the start.
  #
  # Off by default because it disables the verification that makes a push
  # trustworthy — the image that arrives can no longer be proven to be the image
  # that was pushed. Turn it on deliberately, knowing which registry it applies
  # to.
  insecureRegistry: false

  # The name of the registry credential: how AppLab authenticates to
  # build.registry, both to push the image it builds and for the app to pull it
  # again. One registry, one Secret, one name.
  #
  # It defaults to "applab-registry", so an install that creates a Secret by that name
  # needs no --set for this at all. Create it before installing AppLab, in
  # AppLab's own namespace:
  #
  #   kubectl -n ops-system create secret docker-registry applab-registry \
  #     --docker-server=registry.example.com \
  #     --docker-username=<user> --docker-password=<password>
  #
  # Set this to a different name to use a Secret you already have. Set it to ""
  # when the registry needs no authentication — a cluster-local one usually does
  # not — which is the only case that has to say so.
  #
  # Nothing is copied: apps run in the same namespace as the build Job, so both
  # read the Secret where it is. A name that does not exist is refused before
  # anything is created, naming the Secret and the namespace — a Job that exists
  # but cannot start is worse, because it holds the build's name and shows as
  # pending.
  secret: "applab-registry"

  # Resource bounds for a build container, and for the ephemeral storage it
  # holds: the cloned source plus the image kaniko is assembling, unpacked. A
  # build is bursty and unbounded by nature, so without limits a runaway one can
  # evict its neighbours.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi

  workspaceSizeLimit: 10Gi

  # How long a single build may run before it is killed. A Dockerfile that waits
  # on something that never answers would otherwise occupy a slot forever.
  timeout: 30m

  # How long a finished build's Job is kept after it ends. Counted from the
  # moment the Job reaches a terminal state, not from when it started.
  #
  # This is both the window to read a failed build's log *and* — since a build
  # Job is the only record of a build — how far back the build history and a
  # rollback reach. Nothing else stores a build, so lowering this shortens the
  # app's history and the list of commits that can be returned to without
  # rebuilding.
  #
  # What it costs is more than the Job: Kubernetes collects a Job and its pod
  # together, and a Completed pod holds its container log until it goes. So a
  # day here is a day's worth of finished pods per app. Raise it for a longer
  # history and rollback window; a busy app accumulates in proportion.
  #
  # Zero would delete the Job the instant it ended, making every failure
  # undiagnosable and leaving a rollback nothing to find, so it is validated as
  # a positive duration.
  ttlAfterFinished: 24h

# ---------------------------------------------------------------------------
# Deploy
#
# How apps are published. AppLab attaches a VirtualService to an Istio gateway
# rather than creating an Ingress, because the routing in front of these apps is
# an Istio gateway and an Ingress would be ignored by it — the app would deploy,
# report healthy, and be unreachable.
# ---------------------------------------------------------------------------
deploy:
  # The Istio gateway apps are published through, as "<namespace>/<name>".
  #
  # The gateway is cluster infrastructure that already exists: it holds the
  # listeners and the certificate for the whole domain. AppLab attaches to it by
  # name and never creates it. Required whenever ingress.host is set, because a
  # VirtualService with no gateway is reachable only from inside the mesh.
  #
  # The default is the naming the official istio/gateway Helm chart produces:
  # release "istio-ingress" in namespace "istio-ingress". A cluster installed
  # with `istioctl install` instead names it istio-system/istio-ingressgateway.
  #
  # TLS is not configured here. An app is served over HTTPS when the gateway has
  # an HTTPS listener, with no per-app setting involved.
  gateway: "istio-ingress/istio-ingress"

  # Annotations added to every app's VirtualService, for Istio specifics that
  # vary by cluster.
  annotations: {}
    # istio.io/foo: "bar"

  # Per-app resource defaults, applied to every app AppLab deploys.
  appResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ---------------------------------------------------------------------------
# The domain this installation lives on
#
# One hostname, and it is the whole of the address: AppLab's own console and API
# are served under `path` below, the apps are served under it too, and the
# gateway's certificate covers all of it. There is no second domain setting —
# there used to be one for the apps and one for the console, which described one
# host in two places and made every install repeat itself.
#
# `ingress.host` is the base domain for the apps: with no apps.pathPrefix an app
# called "shop" is at shop.<ingress.host>, and with a prefix it shares this host
# instead. So this is the hostname the gateway needs a listener and a
# certificate for, whether or not there is an Ingress.
#
# Where the console is reached depends on the cluster:
#
#   ingress.enabled            a plain Kubernetes Ingress on this host, at
#                              `path` below — whatever ingress controller the
#                              cluster already runs
#   ingress.enabled=false      a VirtualService on the same host and gateway the
#                              apps use, so the console sits beside them
#
# The gateway route is the fallback rather than the default because it needs the
# gateway to exist, and an installation can reasonably have no ingress
# controller but a gateway, or neither.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt

  # The one hostname this installation is reached at, and the domain its apps
  # are published under. One, not a list: it is a single domain, and every host
  # it answered on would be the same thing reached by another name — which is a
  # redirect or a DNS alias, not a release setting.
  #
  # Empty means apps stay inside the cluster and there is no host for the
  # console either, so the release is reachable by port-forward only, which the
  # install notes say.
  host: applab.example.com

  # The path AppLab is served under on that host.
  #
  # "/applab" by default, so a cluster that already serves something at "/" can
  # host AppLab beside it without a second hostname or a certificate covering
  # one. The server is told about it (`base_path`), so the console, the API and
  # the git endpoints all move under it together — an Ingress routes on a path
  # but cannot strip one, so the server has to expect the prefix rather than
  # receive it stripped.
  #
  # It applies whether or not an Ingress is enabled, because it is the address
  # of the whole installation rather than of one route. With apps.pathPrefix set,
  # the apps are nested under it too, so this is also the path the gateway serves
  # them on.
  #
  # "/" serves AppLab at the root of its host, which is what a dedicated
  # hostname wants.
  path: /applab

  tls: []
    # - secretName: applab-tls
    #   hosts:
    #     - applab.example.com

service:
  type: ClusterIP
  port: 80
  # The port AppLab listens on. The chart sets APPLAB_LISTEN to this value, so
  # the container port, the Service target and the Deployment's probes cannot
  # drift apart — changing it here moves all of them together.
  #
  # 80, so the port AppLab listens on is the port it is reached at. A low port
  # is the reason podSecurityContext lowers ip_unprivileged_port_start below: the
  # container runs as an unprivileged user, and without that the bind is refused
  # and AppLab exits on start-up. A capability does not do it — see the note
  # there for why.
  targetPort: 80

# ---------------------------------------------------------------------------
# Object storage
#
# Everything AppLab remembers lives here: the apps, their commit and build
# history, and every app's git repository — the only copy of the apps' source, so
# the bucket must be backed up.
#
# One directory per app, and its source is one repository per branch:
#
#     apps/<id>/app.json                 the app record
#     apps/<id>/key.json                 the app's API key
#     apps/<id>/commits/<sha>.json       one recorded commit
#     apps/<id>/builds/<id>.json         one build attempt
#     apps/<id>/repo/branches/<branch>/  the repository for one branch
#
# `branches/` is where storage multiplies: each branch holds a full copy of
# everything reachable from it, so three live branches occupy roughly three
# times one branch's repository. Measured, 40 commits of 1 MB files are 39 MB
# with one branch and 78 MB with two. Budget for it if apps are large or
# branches are many — see the chart README for why a shared object database is
# not available through this store.
#
# This is what makes AppLab stateless. There is no volume, no database and no
# state on a replica, so a pod can be replaced at any moment, a node can be lost,
# and more than one replica can serve at once.
#
# Any S3-compatible service works: AWS, MinIO, Ceph, Cloudflare R2. What differs
# between them is the endpoint and whether path-style addressing is needed, and
# both are settings here.
# ---------------------------------------------------------------------------
objectStore:
  # The service's address. AWS is https://s3.<region>.amazonaws.com; a
  # self-hosted service is its own address, e.g. http://minio.ops-system:9000.
  #
  # Required, and the chart refuses to render without it. There is no directory
  # fallback to fall back to — a deployment with no store would have nothing to
  # keep anything in, and it would fail on the first write rather than at startup
  # where the mistake can still be corrected.
  endpoint: ""
  bucket: ""

  # Defaults to us-east-1, which is what a self-hosted service expects and what
  # AWS accepts for a bucket whose region is not otherwise known.
  region: ""

  # The credential. Create the Secret yourself and point at it, or set the two
  # values here and let the chart build one — see the README for which.
  accessKey: ""
  secretKey: ""
  existingSecret: ""

  # Path-style addressing puts the bucket in the request path rather than in the
  # hostname. Required by most self-hosted services, which have no wildcard DNS
  # to put a bucket under, and by any bucket name containing a dot.
  pathStyle: false

  # An optional key prefix, so one bucket can hold more than one AppLab.
  prefix: ""

  # Allows an http endpoint. Explicit rather than inferred from the scheme,
  # because sending a credential and an app's source in the clear is a decision
  # someone has to make on purpose.
  insecure: false

# Scratch space for materialising a repository while git runs against it.
#
# Nothing durable is written here, so this is a bound rather than a requirement:
# without one, cloning a large repository would fill the node's disk.
scratchSizeLimit: 2Gi

# One of debug, info, warn, error.
logLevel: info

# ---------------------------------------------------------------------------
# Resources for AppLab itself
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Upload limits. maxSimpleUpload should stay at or below the body limit of
# whatever proxy sits in front — a rejected body from an ingress arrives as HTML,
# which is useless to a client parsing JSON.
upload:
  maxSimpleUpload: 8388608
  chunkSize: 8388608
  maxChunkBytes: 33554432

serviceAccount:
  create: true
  annotations: {}
  name: ""

# AppLab manages Deployments, Services, VirtualServices and Jobs in the one
# namespace it runs in, so a namespaced Role is enough — no ClusterRole, and no
# permission anywhere else in the cluster. The rules are exactly what it uses;
# see role.yaml for why each is there.
rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  # Lets this pod's unprivileged user bind port 80.
  #
  # This is what makes targetPort 80 work, and it is not optional. AppLab runs as
  # uid 1000, and since Linux 5.7 a bind below 1024 is refused unless the
  # *namespace's* ip_unprivileged_port_start allows it — the kernel's default of
  # 1024 applies to the pod's own network namespace, so setting it here changes
  # nothing outside this pod.
  #
  # The capability route does not work, which is worth saying because it looks
  # like it should and was tried: securityContext.capabilities.add only reaches
  # the *bounding* set for a non-root container. The kernel recomputes the
  # permitted and effective sets at execve, and a non-root process with no file
  # capabilities gets an empty effective set — so NET_BIND_SERVICE is present and
  # grants nothing. Making it effective needs an *ambient* capability, which
  # Kubernetes' Capabilities type cannot express: it has `add` and `drop` and no
  # ambient field. An installation that granted it bound 80 and died with
  # "bind: permission denied".
  #
  # A sysctl rather than runAsUser 0, because the trade is the point: this is
  # one pod gaining one relaxation, in its own namespace, instead of the
  # container running as root.
  #
  # It is in Kubernetes' *safe* sysctl set, so no kubelet flag is needed and the
  # baseline and restricted Pod Security Standards both allow it.
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  # Everything dropped, and nothing added back. Listening on a low port is not a
  # capability here — podSecurityContext.sysctls is what allows it, for the
  # reason given there.
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# The default is generous because the largest legitimate request is a source
# archive. The readiness probe, not a timeout, is what decides liveness.
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Metrics
#
# /metrics is unauthenticated by design — a scraper holds a credential awkwardly
# and the numbers describe the platform rather than any app. In a cluster where
# that matters, keep the Service internal and let Prometheus reach it in-cluster,
# which is what the ServiceMonitor does.
# ---------------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
