# Default values for applab.
#
# applab deploys applications to Kubernetes. It is given a URL and a key, and it
# stores source, builds images and runs the result. Read the notes on `build` and
# `apps.baseDomain` before deploying: both have prerequisites that are easier to
# satisfy before the first install than after.

# Override the chart's name, and the release name it is combined with.
nameOverride: ""
fullnameOverride: ""

# Namespace applab itself runs in. Defaults to the release namespace.
namespaceOverride: ""

image:
  repository: docker.io/shaowenchen/applab
  # Defaults to the chart's appVersion when empty.
  tag: ""
  # Always, deliberately. Nothing here is immutable: a tag can be re-pushed, and
  # a node that already has that tag would keep running the old image. The
  # pull is cheap and the alternative is a deploy that reports success while
  # serving the previous build.
  pullPolicy: Always

imagePullSecrets: []

replicaCount: 1

# ---------------------------------------------------------------------------
# Authentication
#
# There is no user store: an API key *is* the identity, and a key that
# authenticates can do anything this installation can — including delete every
# app it manages. Treat each key as a credential that can destroy data.
#
# Give each caller its own key so one can be revoked without disturbing the
# others: removing it from the list and upgrading is the whole revocation.
# ---------------------------------------------------------------------------
auth:
  # Generate with: openssl rand -hex 32
  keys: []

  # Use an existing Secret instead of the one this chart creates. It must carry
  # an "APPLAB_KEYS" key whose value is the comma-separated list — the same key
  # this chart writes — and it must live in the release namespace. Prefer this
  # in a real deployment: it keeps keys out of the release's values, which are
  # stored in plain text in the cluster and often in version control.
  existingSecret: ""

# ---------------------------------------------------------------------------
# Apps
# ---------------------------------------------------------------------------
apps:
  # The domain apps are exposed under, so an app with id "shop" is served at
  # shop.<baseDomain>.
  #
  # The certificate for this domain lives on the gateway, so it has to cover
  # every host under here — in practice a wildcard. Leave this empty to keep apps
  # reachable only inside the cluster.
  baseDomain: ""

  # Serves every app from one host under one path, instead of giving each app
  # its own subdomain: with pathPrefix "/apps", an app with id "shop" is served
  # at <baseDomain>/apps/shop.
  #
  # The reason to want this is the certificate. A subdomain per app needs a
  # wildcard DNS record and a wildcard certificate, and both have to be reissued
  # as the deployment grows. One host and one path prefix needs neither, so a
  # single ordinary certificate covers any number of apps.
  #
  # What it costs: every app now shares an origin. A browser's per-origin limits
  # and its cookies are shared between apps, and two apps cannot both own "/".
  # This is the right trade when the alternative is a wildcard certificate and
  # the wrong one when the apps are meant to be genuinely separate sites.
  #
  # applab strips the prefix before the request reaches the app, so an app sees
  # the paths it would see at a root and needs no change to work here. It also
  # sets X-Forwarded-Prefix, which an app that honours it can use to build
  # correct absolute links.
  pathPrefix: ""

  # The public address of this applab installation, used by build jobs to fetch
  # source and reported to clients as api_base_url.
  #
  # Leave empty to use the in-cluster Service, which is correct when builds run
  # in the same cluster and the ingress is not reachable from inside it — the
  # usual case. Set it when a build must reach applab through an external
  # address.
  baseURL: ""

# ---------------------------------------------------------------------------
# Build pipeline
#
# applab can run without this: source storage, the API and the console all work,
# and apps can be deployed from images built elsewhere. With it, pushing source
# builds an image in the cluster.
#
# Builds run as a Job per build, with BuildKit rootless over a fetched source
# tree. Rootless needs the node to permit unprivileged user namespaces — see the
# README's prerequisites. `privileged` is the escape hatch for a cluster that
# does not, at the cost of running builds with full privileges.
# ---------------------------------------------------------------------------
build:
  enabled: true

  # Where built images are pushed. Required when enabled.
  #
  # The image is <registry>/<app>:<commit>, so each app needs its own repository
  # under this prefix. A cluster-local registry (registry:2 in-cluster) works;
  # a hosted one needs credentials, see pushSecret.
  registry: ""

  # Registry-side layer cache, under <prefix>/<app>:buildcache. A Job has no
  # persistent disk, so without this every build starts from nothing.
  #
  # Costs one extra image per app in the registry, and repays it on the second
  # build of anything with more than a trivial Dockerfile. Empty disables it.
  cacheRepoPrefix: ""

  # The image providing buildctl and buildkitd. Pinned rather than "latest": a
  # moving tag would change a build's behaviour without applab changing.
  builderImage: "moby/buildkit:v0.19.0"

  # The init container's image. It needs a shell, curl and tar.
  fetcherImage: "alpine:3.21"

  # Run BuildKit as an unprivileged user. Recommended, and the default.
  #
  # Requires the node to allow unprivileged user namespaces and an unconfined
  # seccomp profile — see the README. Set false only when the cluster cannot
  # satisfy that; it makes every build a container breakout away from the node,
  # and a build runs code from whoever pushed the source.
  rootless: true

  # Load the *pushed* image into the cluster's container runtime from the build
  # job, when the cluster runs its own registry and the runtime cannot pull it.
  #
  # Only needed for a registry that is not resolvable or not trusted from the
  # node. It requires mounting the runtime's socket into the build job, which
  # grants that job control of the node's container runtime — so it is off by
  # default and should stay off unless there is no alternative.
  insecureRegistry: false

  # A Secret holding registry credentials, copied into each app namespace so the
  # build job can push. It must be a docker-registry Secret, and it must already
  # exist in applab's own namespace — for example created from a docker login.
  #
  # If it is named here and missing, a build fails before its Job is created
  # rather than starting and failing at the push minutes later.
  pushSecret: ""

  # Resource bounds for a build container and for the ephemeral volume the
  # source and BuildKit's intermediate state share. Builds are bursty and
  # unbounded by nature; without limits a runaway build can evict its neighbours.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi

  workspaceSizeLimit: 10Gi

  # How long a single build may run before it is killed. A Dockerfile that waits
  # on something that never answers would otherwise occupy a slot forever.
  timeout: 30m

  # How long a finished build's Job is kept, so its log can still be read. Zero
  # would delete it the moment it ends and make every failure undiagnosable, so
  # it is validated as a positive duration.
  ttlAfterFinished: 24h

# ---------------------------------------------------------------------------
# Deploy
#
# How apps are published. applab attaches a VirtualService to an Istio gateway
# rather than creating an Ingress, because the routing in front of these apps is
# an Istio gateway and an Ingress would be ignored by it — the app would deploy,
# report healthy, and be unreachable.
# ---------------------------------------------------------------------------
deploy:
  # The Istio gateway apps are published through, as "<namespace>/<name>".
  #
  # The gateway is cluster infrastructure that already exists: it holds the
  # listeners and the certificate for the whole domain. applab attaches to it by
  # name and never creates it. Required whenever apps.baseDomain is set, because
  # a VirtualService with no gateway is reachable only from inside the mesh.
  #
  # The default is the naming the official istio/gateway Helm chart produces:
  # release "istio-ingress" in namespace "istio-ingress". A cluster installed
  # with `istioctl install` instead names it istio-system/istio-ingressgateway.
  #
  # TLS is not configured here. An app is served over HTTPS when the gateway has
  # an HTTPS listener, with no per-app setting involved.
  gateway: "istio-ingress/istio-ingress"

  # A docker-registry Secret for pulling an app's image. Empty means the registry
  # needs no authentication to read from, which is the case for a cluster-local
  # one.
  #
  # This is separate from build.pushSecret on purpose: pushing and pulling can
  # need different credentials, and a registry that is open to pull but not to
  # push only needs the build one.
  #
  # The Secret must already exist in applab's own namespace — for example created
  # from a docker login. It is referenced directly rather than copied, because
  # apps run in that same namespace.
  imagePullSecret: ""

  # Annotations added to every app's VirtualService, for Istio specifics that
  # vary by cluster.
  annotations: {}
    # istio.io/foo: "bar"

  # Per-app resource defaults, applied to every app applab deploys.
  appResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ---------------------------------------------------------------------------
# How a person reaches applab itself
#
# This is a standard Kubernetes Ingress for the console and the API — separate
# from how apps are published, which goes through the Istio gateway above. If
# your cluster has no ingress controller, set enabled to false and reach applab
# by port-forward.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: applab.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: applab-tls
    #   hosts:
    #     - applab.example.com

service:
  type: ClusterIP
  port: 80
  # The port applab listens on. The chart sets APPLAB_LISTEN to this value, so
  # the container port, the Service target and the Deployment's probes cannot
  # drift apart — changing it here moves all of them together.
  targetPort: 8080

# ---------------------------------------------------------------------------
# Storage
#
# Holds the SQLite database and every app's git repository — the only copy of
# the apps' source, so it must be backed up.
#
# Note the replica count: SQLite cannot be shared between processes over a
# network volume, so this is a single-replica deployment by design. Scaling out
# means moving to a database built for it.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  # Defaults to the chart's storageClass when empty.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 50Gi
  # Use an existing claim instead of creating one.
  existingClaim: ""
  annotations: {}

# One of debug, info, warn, error.
logLevel: info

# ---------------------------------------------------------------------------
# Resources for applab itself
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Upload limits. maxSimpleUpload should stay at or below the body limit of
# whatever proxy sits in front — a rejected body from an ingress arrives as HTML,
# which is useless to a client parsing JSON.
upload:
  maxSimpleUpload: 8388608
  chunkSize: 8388608
  maxChunkBytes: 33554432

serviceAccount:
  create: true
  annotations: {}
  name: ""

# applab manages Deployments, Services, VirtualServices and Jobs in the one
# namespace it runs in, so a namespaced Role is enough — no ClusterRole, and no
# permission anywhere else in the cluster. The rules are exactly what it uses;
# see role.yaml for why each is there.
rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# The default is generous because the largest legitimate request is a source
# archive. The readiness probe, not a timeout, is what decides liveness.
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Metrics
#
# /metrics is unauthenticated by design — a scraper holds a credential awkwardly
# and the numbers describe the platform rather than any app. In a cluster where
# that matters, keep the Service internal and let Prometheus reach it in-cluster,
# which is what the ServiceMonitor does.
# ---------------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
