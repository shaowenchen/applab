    get:
      operationId: streamAppLogs
      summary: A pod's log as `text/plain`.
      description: 'A pod''s log as `text/plain`. Follows the pod by default; `?follow=false` returns what exists and closes. `?pod=` and `?container=` narrow it (default: the newest pod and the app container). `?previous=true` reads the previous container instance — where a crash loop''s reason is written. `?tail=` (default 500, max 10000), `?since=` a duration such as `5m`.'
      tags:
        - observe
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: pod
          in: query
          description: Read one pod's log by name.
          schema:
            type: string
        - name: container
          in: query
          description: Read one container's log within the pod.
          schema:
            type: string
        - name: tail
          in: query
          description: Number of lines from the end to return.
          schema:
            type: integer
        - name: previous
          in: query
          description: Read the previous container instance, where a crash loop's reason is written.
          schema:
            type: boolean
        - name: since
          in: query
          description: Only lines newer than this duration or timestamp.
          schema:
            type: string
        - name: follow
          in: query
          description: Keep the connection open and stream lines as they arrive rather than returning what exists now. Read the body incrementally; the response may never end.
          schema:
            type: boolean
          example: true
      responses:
        "200":
          description: A plain-text body.
          content:
            text/plain:
              schema:
                type: string
              x-streaming: true
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
