openapi: 3.1.0
info:
  title: AppLab API
  description: |-
    AppLab deploys an application to Kubernetes by uploading its source.

    Every JSON route answers inside a `{"data": ...}` envelope, except `/health`; failures answer `{"error": "...", "retryable": bool}`. Three routes answer `text/plain` and may stream (`x-streaming`), which a client must read incrementally rather than buffer.

    This document is generated from AppLab's route table. Do not edit it by hand — run `make gen-openapi`.
  version: v1
servers:
  - url: '{baseUrl}'
    description: The deployment's address, including any base path (for example https://applab.example.com/applab).
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Liveness, configuration and self-description.
  - name: platform
    description: The AppLab deployment itself, rather than the apps it manages.
  - name: apps
    description: Create, read, update and delete apps.
  - name: servers
    description: Other AppLab deployments this one can manage.
  - name: config
    description: An app's environment, secrets and key.
  - name: source
    description: Uploading an app's source and managing its branches.
  - name: builds
    description: Building a commit into an image.
  - name: deploy
    description: Running an image, and stopping or rolling back what runs.
  - name: observe
    description: Logs, usage, events and diagnosis.
  - name: git
    description: Cloning and pushing source over git.
paths:
  /api/v1/apps:
    get:
      operationId: listApps
      summary: List apps.
      description: List apps.
      tags:
        - apps
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        app_key:
                          type: string
                        auto_deploy:
                          type: boolean
                        branch:
                          type: string
                        build_status:
                          type: string
                        commit_sha:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        dockerfile:
                          type: string
                        domain:
                          type: string
                        env_count:
                          type: integer
                        git_url:
                          type: string
                        git_url_with_key:
                          type: string
                        id:
                          type: string
                        image:
                          type: string
                        name:
                          type: string
                        port:
                          type: integer
                          format: int32
                        replicas:
                          type: integer
                          format: int32
                        resources:
                          $ref: '#/components/schemas/AppResources'
                        run_status:
                          type: string
                        status:
                          type: string
                        status_reason:
                          type: string
                        updated_at:
                          type: string
                          format: date-time
                        url:
                          type: string
                      required:
                        - app_key
                        - auto_deploy
                        - branch
                        - build_status
                        - commit_sha
                        - created_at
                        - dockerfile
                        - domain
                        - env_count
                        - git_url
                        - git_url_with_key
                        - id
                        - image
                        - name
                        - port
                        - replicas
                        - resources
                        - run_status
                        - status
                        - status_reason
                        - updated_at
                        - url
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
    post:
      operationId: createApp
      summary: Create an app.
      description: 'Create an app. Body: `{id, name?, port?, replicas?, dockerfile?, domain?}`.'
      tags:
        - apps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_key:
                        type: string
                      auto_deploy:
                        type: boolean
                      branch:
                        type: string
                      build_status:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      dockerfile:
                        type: string
                      domain:
                        type: string
                      env_count:
                        type: integer
                      git_url:
                        type: string
                      git_url_with_key:
                        type: string
                      id:
                        type: string
                      image:
                        type: string
                      name:
                        type: string
                      port:
                        type: integer
                        format: int32
                      replicas:
                        type: integer
                        format: int32
                      resources:
                        $ref: '#/components/schemas/AppResources'
                      run_status:
                        type: string
                      status:
                        type: string
                      status_reason:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
                      url:
                        type: string
                    required:
                      - app_key
                      - auto_deploy
                      - branch
                      - build_status
                      - commit_sha
                      - created_at
                      - dockerfile
                      - domain
                      - env_count
                      - git_url
                      - git_url_with_key
                      - id
                      - image
                      - name
                      - port
                      - replicas
                      - resources
                      - run_status
                      - status
                      - status_reason
                      - updated_at
                      - url
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: admin
  /api/v1/apps/{app}:
    get:
      operationId: getApp
      summary: One app.
      description: One app.
      tags:
        - apps
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_key:
                        type: string
                      auto_deploy:
                        type: boolean
                      branch:
                        type: string
                      build_status:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      dockerfile:
                        type: string
                      domain:
                        type: string
                      env_count:
                        type: integer
                      git_url:
                        type: string
                      git_url_with_key:
                        type: string
                      id:
                        type: string
                      image:
                        type: string
                      name:
                        type: string
                      port:
                        type: integer
                        format: int32
                      replicas:
                        type: integer
                        format: int32
                      resources:
                        $ref: '#/components/schemas/AppResources'
                      run_status:
                        type: string
                      status:
                        type: string
                      status_reason:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
                      url:
                        type: string
                    required:
                      - app_key
                      - auto_deploy
                      - branch
                      - build_status
                      - commit_sha
                      - created_at
                      - dockerfile
                      - domain
                      - env_count
                      - git_url
                      - git_url_with_key
                      - id
                      - image
                      - name
                      - port
                      - replicas
                      - resources
                      - run_status
                      - status
                      - status_reason
                      - updated_at
                      - url
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
    patch:
      operationId: updateApp
      summary: 'Change an app''s settings: `{name?, port?, replicas?, dockerfile?, domain?, auto_deploy?, branch?, resources?}`.'
      description: 'Change an app''s settings: `{name?, port?, replicas?, dockerfile?, domain?, auto_deploy?, branch?, resources?}`. Fields omitted are left alone; a resource field set to an empty string returns it to this deployment''s default from `deploy.appResources`. Changing resources does not redeploy — the app''s next deploy applies them.'
      tags:
        - apps
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_key:
                        type: string
                      auto_deploy:
                        type: boolean
                      branch:
                        type: string
                      build_status:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      dockerfile:
                        type: string
                      domain:
                        type: string
                      env_count:
                        type: integer
                      git_url:
                        type: string
                      git_url_with_key:
                        type: string
                      id:
                        type: string
                      image:
                        type: string
                      name:
                        type: string
                      port:
                        type: integer
                        format: int32
                      replicas:
                        type: integer
                        format: int32
                      resources:
                        $ref: '#/components/schemas/AppResources'
                      run_status:
                        type: string
                      status:
                        type: string
                      status_reason:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
                      url:
                        type: string
                    required:
                      - app_key
                      - auto_deploy
                      - branch
                      - build_status
                      - commit_sha
                      - created_at
                      - dockerfile
                      - domain
                      - env_count
                      - git_url
                      - git_url_with_key
                      - id
                      - image
                      - name
                      - port
                      - replicas
                      - resources
                      - run_status
                      - status
                      - status_reason
                      - updated_at
                      - url
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
    delete:
      operationId: deleteApp
      summary: Delete the app and everything applab recorded for it.
      description: 'Delete the app and everything applab recorded for it. `?keep_source=true` retains the git repository. Requires an admin key: an app key may manage its app but not destroy it.'
      tags:
        - apps
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: keep_source
          in: query
          description: Retain the git repository when the app is deleted.
          schema:
            type: boolean
          example: false
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                      id:
                        type: string
                      keep_source:
                        type: boolean
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/agent/files:
    get:
      operationId: listAgentFiles
      summary: The names of the files applab keeps in this app's source tree.
      description: The names of the files applab keeps in this app's source tree. Each is servable from `GET /api/v1/apps/{app}/agent/files/{file}`.
      tags:
        - config
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentFile'
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/agent/files/{file}:
    get:
      operationId: getAgentFile
      summary: One of the files applab keeps in this app's source tree (`applab.sh`, `AGENT.md`), as `text/plain`.
      description: One of the files applab keeps in this app's source tree (`applab.sh`, `AGENT.md`), as `text/plain`. This is the current version the deployment would write on the next upload — a copy in a repository can fetch it to bring itself up to date, since applab's API changes between releases. It carries this app's own key as the default `APPLAB_KEY` and this deployment's address as the default `APPLAB_URL`, so **treat the response as a credential**; see `?list` on the app's source for what else is in the tree.
      tags:
        - config
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: file
          in: path
          required: true
          schema:
            type: string
          example: applab.sh
      responses:
        "200":
          description: A plain-text body.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/branch:
    put:
      operationId: switchBranch
      summary: Make a branch active and deploy it.
      description: 'Make a branch active and deploy it. Body: `{"branch":"dev"}`. The branch must already have been pushed to. This replaces what is running: one app runs one branch.'
      tags:
        - source
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchBranchRequest'
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app:
                        $ref: '#/components/schemas/App'
                      build:
                        $ref: '#/components/schemas/Build'
                        nullable: true
                      commit:
                        type: string
                      image:
                        type: string
                      url:
                        type: string
                    required:
                      - app
                      - build
                      - commit
                      - image
                      - url
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/branches:
    get:
      operationId: listBranches
      summary: The branches this app has source for, and which one is active.
      description: The branches this app has source for, and which one is active. A branch is created by pushing to it, so this is what the app has been pushed to.
      tags:
        - source
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      active:
                        type: string
                      app_id:
                        type: string
                      branches:
                        type: array
                        items:
                          type: string
                    required:
                      - active
                      - app_id
                      - branches
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/builds:
    get:
      operationId: listBuilds
      summary: An app's builds, newest first, read from the build Jobs.
      description: An app's builds, newest first, read from the build Jobs. `?limit=` (default 20). How far back this reaches is build.ttlAfterFinished, because the Job is the record.
      tags:
        - builds
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: limit
          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
          example: 20
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        app_id:
                          type: string
                        branch:
                          type: string
                        commit_sha:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        id:
                          type: string
                        image:
                          type: string
                        job_name:
                          type: string
                        pod:
                          $ref: '#/components/schemas/Pod'
                          nullable: true
                        reason:
                          type: string
                        status:
                          type: string
                      required:
                        - app_id
                        - branch
                        - commit_sha
                        - created_at
                        - id
                        - image
                        - job_name
                        - pod
                        - reason
                        - status
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
    post:
      operationId: startBuild
      summary: Build an image from a commit.
      description: Build an image from a commit. Body `{commit_sha?, deploy?}` — omit `commit_sha` to build the current tip. Returns immediately; the build runs as a Job in the cluster. A build deploys what it builds once it succeeds, the same way a push does, subject to the app's `auto_deploy` switch and to the branch being the app's active one; pass `"deploy":false` (or `?deploy=false`) to build the image and stop. Returns 501 if this deployment cannot build.
      tags:
        - builds
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: branch
          in: query
          description: Build another branch without switching to it.
          schema:
            type: string
        - name: deploy
          in: query
          description: Deploy the commit once the build succeeds. Defaults to true; send false to build the image and stop.
          schema:
            type: boolean
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRequest'
      responses:
        "202":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_id:
                        type: string
                      branch:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      id:
                        type: string
                      image:
                        type: string
                      job_name:
                        type: string
                      pod:
                        $ref: '#/components/schemas/Pod'
                        nullable: true
                      reason:
                        type: string
                      status:
                        type: string
                    required:
                      - app_id
                      - branch
                      - commit_sha
                      - created_at
                      - id
                      - image
                      - job_name
                      - pod
                      - reason
                      - status
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/builds/{build}:
    get:
      operationId: getBuild
      summary: 'One build, read from the build Job: its commit, branch, status, and the image if it succeeded.'
      description: 'One build, read from the build Job: its commit, branch, status, and the image if it succeeded. A build whose Job has been collected by its TTL is gone — build.ttlAfterFinished sets how long that is.'
      tags:
        - builds
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: build
          in: path
          required: true
          schema:
            type: string
          example: a1b2c3d4e5f6
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_id:
                        type: string
                      branch:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      id:
                        type: string
                      image:
                        type: string
                      job_name:
                        type: string
                      pod:
                        $ref: '#/components/schemas/Pod'
                        nullable: true
                      reason:
                        type: string
                      status:
                        type: string
                    required:
                      - app_id
                      - branch
                      - commit_sha
                      - created_at
                      - id
                      - image
                      - job_name
                      - pod
                      - reason
                      - status
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
    delete:
      operationId: cancelBuild
      summary: Stop a build that has not finished, and mark it `cancelled`.
      description: Stop a build that has not finished, and mark it `cancelled`. A build that already finished is refused with 409 rather than relabelled. Returns 501 if this deployment cannot build.
      tags:
        - builds
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: build
          in: path
          required: true
          schema:
            type: string
          example: a1b2c3d4e5f6
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_id:
                        type: string
                      branch:
                        type: string
                      commit_sha:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      id:
                        type: string
                      image:
                        type: string
                      job_name:
                        type: string
                      pod:
                        $ref: '#/components/schemas/Pod'
                        nullable: true
                      reason:
                        type: string
                      status:
                        type: string
                    required:
                      - app_id
                      - branch
                      - commit_sha
                      - created_at
                      - id
                      - image
                      - job_name
                      - pod
                      - reason
                      - status
                required:
                  - data
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/builds/{build}/logs:
    get:
      operationId: streamBuildLogs
      summary: The build's log, as `text/plain`.
      description: The build's log, as `text/plain`. Follows the build while it runs and ends when it finishes; works unchanged for a build that has already finished. `?follow=false` returns what exists so far and stops.
      tags:
        - builds
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: build
          in: path
          required: true
          schema:
            type: string
          example: a1b2c3d4e5f6
        - name: follow
          in: query
          description: Keep the connection open and stream lines as they arrive rather than returning what exists now. Read the body incrementally; the response may never end.
          schema:
            type: boolean
          example: false
      responses:
        "200":
          description: A plain-text body.
          content:
            text/plain:
              schema:
                type: string
              x-streaming: true
        default:
          description: Failure. `retryable` says whether the same call could succeed on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-applab-tier: app
  /api/v1/apps/{app}/commits:
    get:
      operationId: listCommits
      summary: An app's commit history, newest first, with the current tip.
      description: An app's commit history, newest first, with the current tip. `?limit=` (default 50). `?branch=` reads another branch's history.
      tags:
        - source
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: shop
        - name: limit
          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
          example: 20
        - name: branch
          in: query
          description: Read another branch's history.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
