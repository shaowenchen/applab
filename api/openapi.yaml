          schema:
            type: string
        - name: tail
          in: query
          description: Number of lines from the end to return.
          schema:
            type: integer
        - name: previous
          in: query
          description: Read the previous container instance, where a crash loop's reason is written.
          schema:
            type: boolean
        - name: since
          in: query
          description: Only lines newer than this duration or timestamp.
          schema:
            type: string
        - name: follow
          in: query
